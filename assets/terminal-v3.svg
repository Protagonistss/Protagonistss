<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .text { 
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; 
        font-size: 14.5px; 
        fill: #c9d1d9; 
      }
      .prompt { fill: #7ee787; font-weight: 600; }
      .path { fill: #58a6ff; font-weight: 600; }
      .command { fill: #f0f6fc; font-weight: 600; }
      .highlight { fill: #ff7b72; font-weight: 600; }
      .string { fill: #a5d6ff; }
      .array { fill: #d2a8ff; }
      .stat-key { fill: #8b949e; }
      .stat-val { fill: #7ee787; font-weight: 600; }
      
      .type-1, .type-2, .type-3, .type-4, .type-5, .type-6, .type-7, .type-8, .type-9, .type-10 { opacity: 0; }
      
      @keyframes show { to { opacity: 1; } }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .type-1 { animation: show 0.1s forwards; animation-delay: 0.5s; }
      .type-2 { animation: show 0.1s forwards; animation-delay: 1.0s; }
      
      .type-3 { animation: show 0.1s forwards; animation-delay: 2.0s; }
      .type-4 { animation: show 0.1s forwards; animation-delay: 2.5s; }
      
      .type-5 { animation: show 0.1s forwards; animation-delay: 3.5s; }
      .type-6 { animation: show 0.1s forwards; animation-delay: 4.0s; }
      
      .type-7 { animation: show 0.1s forwards; animation-delay: 5.0s; }
      .type-8 { animation: show 0.1s forwards; animation-delay: 5.5s; }
      
      .type-9 { animation: show 0.1s forwards; animation-delay: 6.5s; }
      
      .caret {
        display: inline-block;
        fill: #c9d1d9;
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>
  
  <rect class="bg" width="100%" height="100%" />
  
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />

  <!-- Line 1: whoami -->
  <g transform="translate(20, 60)" class="type-1">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">whoami</tspan></text>
  </g>
  <g transform="translate(20, 85)" class="type-2">
    <text class="text">Protagonistss</text>
  </g>

  <!-- Line 2: fetch bio -->
  <g transform="translate(20, 125)" class="type-3">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">cat</tspan> bio.json</text>
  </g>
  <g transform="translate(20, 150)" class="type-4">
    <text class="text" xml:space="preserve">{ <tspan class="highlight">"role"</tspan>: <tspan class="string">"Full-Stack Developer"</tspan>, <tspan class="highlight">"passion"</tspan>: <tspan class="string">"Navigating the matrix"</tspan> }</text>
  </g>

  <!-- Line 3: fetch skills -->
  <g transform="translate(20, 190)" class="type-5">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">cat</tspan> skills.json</text>
  </g>
  <g transform="translate(20, 215)" class="type-6">
    <text class="text">{</text>
  </g>
  <g transform="translate(20, 240)" class="type-6">
    <text class="text" xml:space="preserve">  <tspan class="highlight">"languages"</tspan>: [ <tspan class="array">"Rust"</tspan>, <tspan class="array">"JavaScript"</tspan>, <tspan class="array">"TypeScript"</tspan>, <tspan class="array">"Python"</tspan>, <tspan class="array">"Java"</tspan>, <tspan class="array">"C++"</tspan> ],</text>
  </g>
  <g transform="translate(20, 265)" class="type-6">
    <text class="text" xml:space="preserve">  <tspan class="highlight">"frameworks_tools"</tspan>: [ <tspan class="array">"React"</tspan>, <tspan class="array">"Vue"</tspan>, <tspan class="array">"Node.js"</tspan>, <tspan class="array">"Vim"</tspan>, <tspan class="array">"Git"</tspan>, <tspan class="array">"Linux"</tspan> ]</text>
  </g>
  <g transform="translate(20, 290)" class="type-6">
    <text class="text">}</text>
  </g>

  <!-- Line 4: github stats -->
  <g transform="translate(20, 330)" class="type-7">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">gh</tspan> profile --stats</text>
  </g>
  <g transform="translate(20, 355)" class="type-8">
    <text class="text">
      <tspan class="stat-key" x="0">Public Repos:</tspan>
      <tspan id="stat-repos" class="stat-val" x="120">32</tspan>
      <tspan class="stat-key" x="200">Followers:</tspan>
      <tspan id="stat-followers" class="stat-val" x="330">10</tspan>
    </text>
  </g>
  <g transform="translate(20, 380)" class="type-8">
    <text class="text">
      <tspan class="stat-key" x="0">Top Langs:</tspan>
      <tspan id="stat-langs" class="string" x="120">TypeScript 💙, Python 🐍, Rust 🦀</tspan>
    </text>
  </g>
  <g transform="translate(20, 405)" class="type-8">
    <text class="text">
      <tspan class="stat-key" x="0">Status:</tspan>
      <tspan class="command" x="120">Building awesome things...</tspan>
    </text>
  </g>

  <!-- Line 5: prompt -->
  <g transform="translate(20, 445)" class="type-9">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="caret">█</tspan></text>
  </g>
</svg>
