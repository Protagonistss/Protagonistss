<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .text { 
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; 
        font-size: 15px; 
        fill: #c9d1d9; 
      }
      .prompt { fill: #7ee787; font-weight: 600; }
      .path { fill: #58a6ff; font-weight: 600; }
      .command { fill: #f0f6fc; font-weight: 600; }
      .highlight { fill: #ff7b72; font-weight: 600; }
      .string { fill: #a5d6ff; }
      
      /* Base opacity for animations */
      .type-1, .type-2, .type-3, .type-4, .type-5 { opacity: 0; }
      
      /* CSS Keyframes for sequential appearance */
      @keyframes show {
        to { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      /* Animation Sequence */
      .type-1 { animation: show 0.1s forwards; animation-delay: 0.5s; }
      .type-2 { animation: show 0.1s forwards; animation-delay: 1.2s; }
      .type-3 { animation: show 0.1s forwards; animation-delay: 2.5s; }
      .type-4 { animation: show 0.1s forwards; animation-delay: 3.2s; }
      .type-5 { animation: show 0.1s forwards; animation-delay: 4.5s; }
      
      .caret {
        display: inline-block;
        fill: #c9d1d9;
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>
  
  <!-- Window Background -->
  <rect class="bg" width="100%" height="100%" />
  
  <!-- macOS window controls -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />

  <!-- Terminal Content -->
  <!-- Line 1: whoami -->
  <g transform="translate(20, 60)" class="type-1">
    <text class="text">
      <tspan class="prompt">➜</tspan> 
      <tspan class="path">~</tspan> 
      <tspan class="command">whoami</tspan>
    </text>
  </g>
  
  <g transform="translate(20, 90)" class="type-2">
    <text class="text">Protagonistss</text>
  </g>

  <!-- Line 2: fetch profile -->
  <g transform="translate(20, 130)" class="type-3">
    <text class="text">
      <tspan class="prompt">➜</tspan> 
      <tspan class="path">~</tspan> 
      <tspan class="command">cat</tspan> profile.json
    </text>
  </g>
  
  <g transform="translate(20, 160)" class="type-4">
    <text class="text">
      { <tspan class="highlight">"role"</tspan>: <tspan class="string">"Full-Stack Developer"</tspan>, <tspan class="highlight">"passion"</tspan>: <tspan class="string">"Navigating the matrix"</tspan> }
    </text>
  </g>

  <!-- Line 3: input waiting -->
  <g transform="translate(20, 200)" class="type-5">
    <text class="text">
      <tspan class="prompt">➜</tspan> 
      <tspan class="path">~</tspan> 
      <tspan class="caret">█</tspan>
    </text>
  </g>

</svg>
