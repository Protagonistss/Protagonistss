<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .text { 
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; 
        font-size: 14.5px; 
        fill: #c9d1d9; 
      }
      .prompt { fill: #7ee787; font-weight: 600; }
      .path { fill: #58a6ff; font-weight: 600; }
      .command { fill: #f0f6fc; font-weight: 600; }
      .highlight { fill: #ff7b72; font-weight: 600; }
      .string { fill: #a5d6ff; }
      .array { fill: #d2a8ff; }
      
      /* Base opacity for animations */
      .type-1, .type-2, .type-3, .type-4, .type-5, .type-6, .type-7 { opacity: 0; }
      
      /* CSS Keyframes */
      @keyframes show { to { opacity: 1; } }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      /* Animation Sequence */
      .type-1 { animation: show 0.1s forwards; animation-delay: 0.5s; }
      .type-2 { animation: show 0.1s forwards; animation-delay: 1.0s; }
      
      .type-3 { animation: show 0.1s forwards; animation-delay: 2.0s; }
      .type-4 { animation: show 0.1s forwards; animation-delay: 2.5s; }
      
      .type-5 { animation: show 0.1s forwards; animation-delay: 3.5s; }
      .type-6 { animation: show 0.1s forwards; animation-delay: 4.0s; }
      
      .type-7 { animation: show 0.1s forwards; animation-delay: 5.0s; }
      
      .caret {
        display: inline-block;
        fill: #c9d1d9;
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>
  
  <rect class="bg" width="100%" height="100%" />
  
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />

  <!-- Line 1: whoami -->
  <g transform="translate(20, 60)" class="type-1">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">whoami</tspan></text>
  </g>
  <g transform="translate(20, 85)" class="type-2">
    <text class="text">Protagonistss</text>
  </g>

  <!-- Line 2: fetch bio -->
  <g transform="translate(20, 125)" class="type-3">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">cat</tspan> bio.json</text>
  </g>
  <g transform="translate(20, 150)" class="type-4">
    <text class="text">{ <tspan class="highlight">"role"</tspan>: <tspan class="string">"Full-Stack Developer"</tspan>, <tspan class="highlight">"passion"</tspan>: <tspan class="string">"Navigating the matrix"</tspan> }</text>
  </g>

  <!-- Line 3: fetch skills -->
  <g transform="translate(20, 190)" class="type-5">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="command">cat</tspan> skills.json</text>
  </g>
  <g transform="translate(20, 215)" class="type-6">
    <text class="text">[ <tspan class="array">"Rust"</tspan>, <tspan class="array">"JavaScript"</tspan>, <tspan class="array">"TypeScript"</tspan>, <tspan class="array">"Vue"</tspan>, <tspan class="array">"React"</tspan> ]</text>
  </g>

  <!-- Line 4: prompt -->
  <g transform="translate(20, 255)" class="type-7">
    <text class="text"><tspan class="prompt">➜</tspan> <tspan class="path">~</tspan> <tspan class="caret">█</tspan></text>
  </g>
</svg>
