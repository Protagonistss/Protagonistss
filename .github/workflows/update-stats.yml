name: Update GitHub Stats in SVG

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-svg-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Update Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          echo "Fetching stats..."
          
          # Use /user endpoint to get data including private repos (if PAT has repo scope)
          # Fallback to /users/$GH_USER if token doesn't have proper scope or is missing
          USER_INFO=$(gh api user 2>/dev/null || gh api users/$GH_USER)
          
          PUBLIC_REPOS=$(echo "$USER_INFO" | jq -r '.public_repos // 0')
          PRIVATE_REPOS=$(echo "$USER_INFO" | jq -r '.total_private_repos // 0')
          REPOS=$((PUBLIC_REPOS + PRIVATE_REPOS))
          
          FOLLOWERS=$(echo "$USER_INFO" | jq -r '.followers // 0')
          
          echo "Fetching repositories to calculate top languages..."
          # Use user/repos to include private repos, fallback to users/$GH_USER/repos
          LANGS=$(gh api user/repos --paginate --jq '.[].language | select(. != null)' 2>/dev/null || gh api users/$GH_USER/repos --paginate --jq '.[].language | select(. != null)')
          
          # Count languages, sort, and take top 3
          TOP_LANGS=$(echo "$LANGS" | sort | uniq -c | sort -nr | head -n 3 | awk '{$1=""; print $0}' | sed 's/^ *//')
          
          LANG_STR=""
          while IFS= read -r lang; do
            if [ -z "$lang" ]; then continue; fi
            case "$lang" in
              "Rust") emoji="🦀" ;;
              "TypeScript") emoji="💙" ;;
              "Python") emoji="🐍" ;;
              "Vue") emoji="💚" ;;
              "JavaScript") emoji="💛" ;;
              "Java") emoji="☕" ;;
              "C++") emoji="⚙️" ;;
              "HTML") emoji="🌐" ;;
              "CSS") emoji="🎨" ;;
              "Jupyter Notebook") emoji="📓" ;;
              *) emoji="✨" ;;
            esac
            
            if [ -z "$LANG_STR" ]; then
              LANG_STR="$lang $emoji"
            else
              LANG_STR="$LANG_STR, $lang $emoji"
            fi
          done <<< "$TOP_LANGS"
          
          echo "Updated Stats -> Repos: $REPOS | Followers: $FOLLOWERS | Langs: $LANG_STR"
          
          # Update SVG file
          SVG_FILE="assets/terminal-v3.svg"
          
          # Use sed to replace the content between the tspan tags
          sed -i -E "s|(<tspan id=\"stat-repos\"[^>]*>).*?(</tspan>)|\1$REPOS\2|" "$SVG_FILE"
          sed -i -E "s|(<tspan id=\"stat-followers\"[^>]*>).*?(</tspan>)|\1$FOLLOWERS\2|" "$SVG_FILE"
          sed -i -E "s|(<tspan id=\"stat-langs\"[^>]*>).*?(</tspan>)|\1$LANG_STR\2|" "$SVG_FILE"
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --exit-code; then
            echo "No changes to commit."
          else
            git add assets/terminal-v3.svg
            git commit -m "chore: auto-update github stats in SVG [skip ci]"
            git push
          fi
