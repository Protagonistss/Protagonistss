name: Update GitHub Stats in SVG

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-svg-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Update Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          echo "Fetching stats for $GH_USER..."
          
          # Get basic stats
          USER_INFO=$(gh api users/$GH_USER)
          REPOS=$(echo "$USER_INFO" | jq -r '.public_repos')
          FOLLOWERS=$(echo "$USER_INFO" | jq -r '.followers')
          
          # Get top languages
          echo "Fetching repositories to calculate top languages..."
          LANGS=$(gh api users/$GH_USER/repos --paginate --jq '.[].language' | grep -v 'null' | sort | uniq -c | sort -nr | head -n 3 | awk '{print $2}')
          
          LANG_STR=""
          for lang in $LANGS; do
            case $lang in
              "Rust") emoji="🦀" ;;
              "TypeScript") emoji="💙" ;;
              "Python") emoji="🐍" ;;
              "Vue") emoji="💚" ;;
              "JavaScript") emoji="💛" ;;
              "Java") emoji="☕" ;;
              "C++") emoji="⚙️" ;;
              *) emoji="✨" ;;
            esac
            
            if [ -z "$LANG_STR" ]; then
              LANG_STR="$lang $emoji"
            else
              LANG_STR="$LANG_STR, $lang $emoji"
            fi
          done
          
          echo "Updated Stats -> Repos: $REPOS | Followers: $FOLLOWERS | Langs: $LANG_STR"
          
          # Update SVG file
          SVG_FILE="assets/terminal-v3.svg"
          
          # Use sed to replace the content between the tspan tags
          sed -i -E "s|(<tspan id=\"stat-repos\"[^>]*>).*?(</tspan>)|\1$REPOS\2|" "$SVG_FILE"
          sed -i -E "s|(<tspan id=\"stat-followers\"[^>]*>).*?(</tspan>)|\1$FOLLOWERS\2|" "$SVG_FILE"
          sed -i -E "s|(<tspan id=\"stat-langs\"[^>]*>).*?(</tspan>)|\1$LANG_STR\2|" "$SVG_FILE"
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --exit-code; then
            echo "No changes to commit."
          else
            git add assets/terminal-v3.svg
            git commit -m "chore: auto-update github stats in SVG [skip ci]"
            git push
          fi
