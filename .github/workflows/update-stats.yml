name: Update GitHub Stats in SVG

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-svg-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Update Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          echo "Fetching stats..."
          
          # Use /user endpoint to get data including private repos (if PAT has repo scope)
          # Fallback to /users/$GH_USER if token doesn't have proper scope or is missing
          USER_INFO=$(gh api user 2>/dev/null || gh api users/$GH_USER)
          
          # Note: GH_PAT 是 fine-grained PAT,/user 端点的
          # total_private_repos / owned_private_repos 字段返回 null,
          # 无法用于统计私有仓库数。改用 /user/repos 实际列表计数。
          # 口径:owner == 当前账号的仓库(公开 + 私有),不含仅作协作者参与的他人仓库。
          GH_LOGIN=$(echo "$USER_INFO" | jq -r '.login // ""')
          REPOS=$(gh api user/repos --paginate --jq '.[] | select(.owner.login=="'"$GH_LOGIN"'") | .id' 2>/dev/null | sort -u | wc -l | tr -d ' ')
          
          FOLLOWERS=$(echo "$USER_INFO" | jq -r '.followers // 0')
          
          echo "Fetching repositories to calculate top languages (by code bytes)..."
          # 同一口径:仅统计自己拥有的仓库(含私有);按代码字节数累加(每仓库调 languages API),
          # 更接近 GitHub 官方语言占比,而非按仓库个数计数。TOP_LANGS 输出每行一个语言名。
          TOP_LANGS=$(gh api user/repos --paginate --jq '.[] | select(.owner.login=="'"$GH_LOGIN"'") | .full_name' 2>/dev/null \
            | while IFS= read -r repo; do
                [ -z "$repo" ] && continue
                gh api "repos/${repo}/languages" 2>/dev/null || echo '{}'
              done \
            | jq -s -r 'reduce .[] as $o ({}; reduce ($o|to_entries)[] as $e (.; .[$e.key] = ((.[$e.key] // 0) + $e.value))) | to_entries | sort_by(-.value) | .[0:3][].key')
          
          LANG_STR=""
          while IFS= read -r lang; do
            if [ -z "$lang" ]; then continue; fi
            case "$lang" in
              "Rust") emoji="🦀" ;;
              "TypeScript") emoji="💙" ;;
              "Python") emoji="🐍" ;;
              "Vue") emoji="💚" ;;
              "JavaScript") emoji="💛" ;;
              "Java") emoji="☕" ;;
              "C++") emoji="⚙️" ;;
              "HTML") emoji="🌐" ;;
              "CSS") emoji="🎨" ;;
              "Jupyter Notebook") emoji="📓" ;;
              *) emoji="✨" ;;
            esac
            
            if [ -z "$LANG_STR" ]; then
              LANG_STR="$lang $emoji"
            else
              LANG_STR="$LANG_STR, $lang $emoji"
            fi
          done <<< "$TOP_LANGS"
          
          echo "Updated Stats -> Repos: $REPOS | Followers: $FOLLOWERS | Langs: $LANG_STR"
          
          # Update SVG file
          SVG_FILE="assets/terminal-v3.svg"
          
          # Use sed to replace the content between the tspan tags
          sed -i -E "s|(<tspan id=\"stat-repos\"[^>]*>).*?(</tspan>)|\1$REPOS\2|" "$SVG_FILE"
          sed -i -E "s|(<tspan id=\"stat-followers\"[^>]*>).*?(</tspan>)|\1$FOLLOWERS\2|" "$SVG_FILE"
          sed -i -E "s|(<tspan id=\"stat-langs\"[^>]*>).*?(</tspan>)|\1$LANG_STR\2|" "$SVG_FILE"
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --exit-code; then
            echo "No changes to commit."
          else
            git add assets/terminal-v3.svg
            git commit -m "chore: auto-update github stats in SVG [skip ci]"
            git push
          fi
